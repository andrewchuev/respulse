services:
  respulse-caddy:
    image: caddy:2-alpine
    container_name: respulse-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - respulse-net
    depends_on:
      - respulse-frontend
      - respulse-backend

  respulse-backend:
    image: ${REGISTRY:-ghcr.io/andrewchuev}/respulse-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: respulse-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@respulse-db:5432/${POSTGRES_DB}
      PORT: 8080
      APP_URL: https://respulse.online
      APP_USER_AGENT: "ResPulse/1.0 (+https://respulse.online)"
      RUST_LOG: respulse_api=info,tower_http=info
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      WAYFORPAY_MERCHANT_ACCOUNT: ${WAYFORPAY_MERCHANT_ACCOUNT:-}
      WAYFORPAY_SECRET_KEY: ${WAYFORPAY_SECRET_KEY:-}
      WAYFORPAY_MERCHANT_PASSWORD: ${WAYFORPAY_MERCHANT_PASSWORD:-}
      WAYFORPAY_MERCHANT_DOMAIN: ${WAYFORPAY_MERCHANT_DOMAIN:-respulse.online}
      WAYFORPAY_CURRENCY: ${WAYFORPAY_CURRENCY:-USD}
      FASTSPRING_WEBHOOK_SECRET: ${FASTSPRING_WEBHOOK_SECRET:-}
      FASTSPRING_LIVE_MODE: ${FASTSPRING_LIVE_MODE:-false}
    depends_on:
      respulse-db:
        condition: service_healthy
    networks:
      - respulse-net

  respulse-frontend:
    image: ${REGISTRY:-ghcr.io/andrewchuev}/respulse-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: respulse-frontend
    restart: unless-stopped
    depends_on:
      - respulse-backend
    networks:
      - respulse-net

  respulse-db:
    image: postgres:16-alpine
    container_name: respulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - respulse-net

  respulse-mailserver:
    image: mailserver/docker-mailserver:latest
    container_name: respulse-mailserver
    hostname: mail
    domainname: respulse.online
    restart: unless-stopped
    ports:
      - "25:25"       # SMTP (incoming)
      - "143:143"     # IMAP (STARTTLS)
      - "465:465"     # SMTPS (implicit TLS)
      - "587:587"     # Submission (STARTTLS)
      - "993:993"     # IMAPS (implicit TLS)
    volumes:
      - mail_data:/var/mail
      - mail_state:/var/mail-state
      - mail_logs:/var/log/mail
      - ./mail-config:/tmp/docker-mailserver
      - caddy_data:/etc/caddy-certs:ro
    environment:
      - OVERRIDE_HOSTNAME=mail.respulse.online
      - DMS_VML=0
      - ENABLE_RSPAMD=0
      - ENABLE_OPENDKIM=1
      - ENABLE_OPENDMARC=1
      - ENABLE_AMAVIS=0
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=1
      - SSL_TYPE=manual
      - SSL_CERT_PATH=/etc/caddy-certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/mail.respulse.online/mail.respulse.online.crt
      - SSL_KEY_PATH=/etc/caddy-certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/mail.respulse.online/mail.respulse.online.key
      - POSTMASTER_ADDRESS=postmaster@respulse.online
      - ONE_DIR=1
      - PERMIT_DOCKER=network
      - SPOOF_PROTECTION=1
      - LOG_LEVEL=info
    cap_add:
      - NET_ADMIN
    networks:
      respulse-net:
        aliases:
          - mail.respulse.online

volumes:
  pg_data:
  caddy_data:
  caddy_config:
  mail_data:
  mail_state:
  mail_logs:

networks:
  respulse-net:
    driver: bridge
