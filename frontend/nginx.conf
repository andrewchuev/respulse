server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The landing page is the only indexable HTML: it carries the crawler-visible copy.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Client-side routes get the noindex shell. Entry points are revalidated so a release is picked up
    # immediately; hashed assets below stay immutable.
    location ~ ^/(app|dashboard|channels|incidents|team|status|status-page|admin|promo|login|register|signup|terms|privacy|refund|verify-email)(/.*)?$ {
        try_files /app.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, follow" always;
    }

    # WayForPay redirects back to returnUrl via HTTP POST; without this, nginx returns 405 Not Allowed
    error_page 405 =200 /app.html;

    # Content-hashed build output never changes.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Unversioned images (og-image, logo) can be replaced, so they get a short cache.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # Everything else is a real file or a real 404 (no soft-404 fallback to the SPA).
    location / {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex" always;
    }
}
