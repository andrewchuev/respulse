services:
  respulse-db:
    image: postgres:16-alpine
    container_name: respulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: respulse
      POSTGRES_PASSWORD: respulse
      POSTGRES_DB: respulse
    volumes:
      - respulse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U respulse -d respulse"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      default:

  respulse-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: respulse-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://respulse:respulse@respulse-db:5432/respulse
      PORT: 8080
      RUST_LOG: respulse_api=debug,tower_http=info
      # Local development only; production must set its own secrets in deploy/.env
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-jwt-secret-change-me-0123456789}
      DEMO_MODE: ${DEMO_MODE:-true}
      FASTSPRING_WEBHOOK_SECRET: ${FASTSPRING_WEBHOOK_SECRET:-}
    depends_on:
      respulse-db:
        condition: service_healthy
    networks:
      default:
      proxy:
        aliases:
          - respulse-api

  respulse-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: respulse-frontend
    restart: unless-stopped
    depends_on:
      - respulse-backend
    networks:
      default:
      proxy:
        aliases:
          - respulse-web

volumes:
  respulse_pg_data:

networks:
  default:
    name: respulse-network
  proxy:
    external: true
