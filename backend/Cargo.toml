[package]
name = "respulse-api"
version = "1.1.4"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws", "macros"] }
tokio = { version = "1.38", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "migrate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
dotenvy = "0.15"
futures-util = "0.3"
rustls = { version = "0.23", features = ["ring"] }
webpki-roots = "0.26"
x509-parser = "0.16"
tokio-rustls = "0.26"
bcrypt = "0.15"
jsonwebtoken = "9.3"
croner = { version = "4.0.2", features = ["chrono"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
hmac = "0.13.0"
md-5 = "0.11.0"
hex = "0.4.3"
subtle = "2.6.1"
sha2 = "0.11.1"
base64 = "0.23.1"
governor = "0.10.4"
url = "2.5.8"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
